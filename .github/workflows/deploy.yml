name: Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            cd /root/projects/dafater-frontend
            git fetch origin main
            git reset --hard origin/main
            # docker-compose.yml (with this service's own build args) lives in the
            # backend repo — keep that checkout current too so a frontend-only deploy
            # never builds against a stale copy, regardless of when backend last deployed.
            cd /root/projects/dafater-backend
            git fetch origin main
            git reset --hard origin/main
            cd /root/projects
            cp dafater-backend/docker-compose.yml docker-compose.yml
            docker compose build frontend
            docker compose up -d --no-deps frontend
            docker image prune -f
