name: Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            cd /root/projects/dafater-frontend
            git fetch origin main
            git reset --hard origin/main
            cd /root/projects
            # /root/projects/docker-compose.yml is a standalone file on this server —
            # it isn't part of either git repo, so this build arg was still hardcoded
            # to the domain and never picked up the same-origin fix. Correct it in
            # place (idempotent: no-op once already fixed) before every build.
            sed -i 's|NEXT_PUBLIC_API_URL: "https://abo-shama.com"|NEXT_PUBLIC_API_URL: ""|' docker-compose.yml
            docker compose build --no-cache frontend
            docker compose up -d --no-deps frontend
            docker image prune -f
