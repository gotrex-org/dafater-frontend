name: Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            if [ ! -d "${{ secrets.SERVER_PATH }}/dafater-frontend" ]; then
              git clone https://github.com/gotrex-org/dafater-frontend.git ${{ secrets.SERVER_PATH }}/dafater-frontend
            fi
            cd ${{ secrets.SERVER_PATH }}/dafater-frontend
            git pull origin main
            cd ${{ secrets.SERVER_PATH }}/dafater-backend
            docker compose build frontend
            docker compose up -d --no-deps frontend
            docker image prune -f
